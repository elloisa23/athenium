<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Athenium — Entrar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="notch"></div>
    <div class="screen">
      <div class="login-screen">
        <div class="login-logo login-logo--img">
          <img src="assets/athenium-logo.png" alt="Athenium" class="login-logo-img">
        </div>
        <div class="brand-name">Athenium</div>
        <p class="login-hint">Insira as informações abaixo para entrar</p>

        <form id="login-form">
          <label class="field">
            <span id="icon-user"></span>
            <input type="text" id="matricula" placeholder="Insira sua Matrícula" autocomplete="username">
          </label>
          <label class="field">
            <span id="icon-lock"></span>
            <input type="password" id="senha" placeholder="Insira sua Senha" autocomplete="current-password">
          </label>
          <p class="login-error" id="login-error"></p>
          <button type="submit" class="btn btn-primary">Acessar Athenium</button>
        </form>

        <p class="login-tagline">BEM-VINDO(A) À ATHENIUM!</p>
      </div>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/data.js"></script>
<script>
  document.getElementById("icon-user").innerHTML = ICONS.user;
  document.getElementById("icon-lock").innerHTML = ICONS.lock;

  // garante que os dados de demonstração existam
  loadState();

  document.getElementById("login-form").addEventListener("submit", function(e){
    e.preventDefault();
    const matricula = document.getElementById("matricula").value.trim();
    const senha = document.getElementById("senha").value.trim();
    const errorEl = document.getElementById("login-error");

    if(!matricula || !senha){
      errorEl.textContent = "Preencha matrícula e senha para continuar.";
      return;
    }
    errorEl.textContent = "";
    localStorage.setItem("athenium_logged_in", "1");
    window.location.href = "home.html";
  });
</script>
</body>
</html>
