<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Athenium — Empréstimos por período</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="notch"></div>
    <div class="screen">
      <div class="app-header">
        <a class="back" href="prazos.html"><span id="back-icon"></span>Empréstimos por período</a>
      </div>
      <div class="content" id="accordion-root"></div>
    </div>
    <div id="bottom-nav-slot"></div>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/data.js"></script>
<script>
  requireLogin();
  mountNav("prazos");
  document.getElementById("back-icon").innerHTML = ICONS.back;

  const state = loadState();
  const root = document.getElementById("accordion-root");
  const months = Object.keys(state.loansByMonth);

  months.forEach((month, idx) => {
    const loans = state.loansByMonth[month];
    const item = document.createElement("div");
    item.className = "accordion-item";

    const readCount = idx === 0 ? state.history.length : 0;

    item.innerHTML = `
      <button class="accordion-trigger ${idx===0 ? 'open':''}">${month}<span>${ICONS.chevronDown}</span></button>
      <div class="accordion-panel ${idx===0 ? 'open':''}">
        ${loans.length ? loans.map(l => `
          <div class="loan-table-row">
            <div class="cover" style="background:${l.color}">${initials(l.title)}</div>
            <div class="lt-title">${l.title}</div>
            <div class="lt-date">${l.date}</div>
          </div>`).join("") : `<p style="font-size:13px;color:var(--ink-faint);text-align:center;padding:10px 0;">Nenhum empréstimo neste mês.</p>`}
        ${loans.length ? `
        <div class="mini-stats">
          <div class="stat read"><b>${state.books.filter(b=>b.status==='andamento').length}</b><span>Livros lidos</span></div>
          <div class="stat unfinished"><b>0</b><span>Livros não concluídos</span></div>
          <div class="stat progress"><b>0</b><span>Em andamento</span></div>
        </div>
        <p style="font-size:10.5px;color:var(--ink-faint);text-align:center;margin-top:10px;">Informações até 31/07</p>` : ""}
      </div>`;
    root.appendChild(item);

    item.querySelector(".accordion-trigger").addEventListener("click", () => {
      item.querySelector(".accordion-trigger").classList.toggle("open");
      item.querySelector(".accordion-panel").classList.toggle("open");
    });
  });
</script>
</body>
</html>
