<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Athenium — Meus Livros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="notch"></div>
    <div class="screen">
      <div class="app-header">
        <h1>Meus Livros</h1>
        <p class="eyebrow" id="today-label" style="margin-top:6px;"></p>
      </div>
      <div class="content">
        <div class="card">
          <div class="section-title">Minha Biblioteca</div>
          <div id="book-list"></div>
        </div>
      </div>
    </div>
    <div id="bottom-nav-slot"></div>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/data.js"></script>
<script>
  requireLogin();
  mountNav("livros");
  document.getElementById("today-label").textContent = "Hoje, 15 de julho";

  const state = loadState();
  const list = document.getElementById("book-list");

  state.books.forEach(b => {
    const badge = b.status === "andamento"
      ? `<span class="badge badge-progress">EM ANDAMENTO</span>`
      : `<span class="badge badge-pending">DEVOLUÇÃO PENDENTE</span><div class="row-sub" style="color:var(--red);margin-top:2px;">Atenção! Este livro precisa ser devolvido.</div>`;
    list.innerHTML += `
      <a class="list-row" href="livro-detalhe.html?id=${b.id}" style="align-items:flex-start;">
        ${coverEl(b)}
        <div>
          <div class="row-title">${b.title}</div>
          <div class="row-sub mt-8">${badge}</div>
        </div>
      </a>`;
  });
</script>
</body>
</html>
