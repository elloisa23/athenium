<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Athenium — Notificações</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="notch"></div>
    <div class="screen">
      <div class="app-header">
        <a class="back" href="home.html"><span id="back-icon"></span>Notificações</a>
        <p class="eyebrow" style="text-align:right;margin-top:-18px;">Últimas Notificações</p>
      </div>
      <div class="content">
        <div class="notif-section-label">Recentes</div>
        <div class="notif-list" id="recent-list"></div>

        <div class="notif-section-label" style="margin-top:20px;">Não-Lidas</div>
        <div class="notif-list" id="unread-list"></div>
      </div>
    </div>
    <div id="bottom-nav-slot"></div>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/data.js"></script>
<script>
  requireLogin();
  mountNav("inicio");
  document.getElementById("back-icon").innerHTML = ICONS.back;

  const state = loadState();
  const recent = document.getElementById("recent-list");
  state.notifications.forEach(n => {
    recent.innerHTML += `<div class="notif-item"><time>${n.time}</time><p>${n.text}</p></div>`;
  });

  const unreadList = document.getElementById("unread-list");
  const unread = state.notifications.filter(n => !n.read);
  if(unread.length === 0){
    unreadList.innerHTML = `<div class="notif-empty">Você está em dia! Nenhuma notificação não lida.</div>`;
  } else {
    unread.forEach(n => {
      unreadList.innerHTML += `<div class="notif-item"><time>${n.time}</time><p>${n.text}</p></div>`;
    });
  }
</script>
</body>
</html>
